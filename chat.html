<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#5a260d">
  <title>Chat JuniorGame</title>
  <link rel="stylesheet" href="css/chat.css?v=3">
</head>
<body>
  <main class="chat-app">
    <header class="chat-header">
      <button id="backButton" class="icon-button" type="button" aria-label="Volver al menú">←</button>
      <button id="onlineUsersButton" class="header-title" type="button" aria-label="Ver jugadores conectados">
        <strong>Chat JuniorGame</strong>
        <span id="onlineSummary">Conectando…</span>
      </button>
      <button id="adminPanelButton" class="icon-button admin-button hidden" type="button" aria-label="Herramientas de administrador">👑</button>
    </header>

    <nav id="channelTabs" class="channel-tabs" aria-label="Canales del chat">
      <button class="channel-tab active" data-channel="global" type="button">🌎 <span>Global</span></button>
      <button class="channel-tab" data-channel="ayuda" type="button">🎮 <span>Ayuda</span></button>
      <button class="channel-tab" data-channel="records" type="button">🏆 <span>Récords</span></button>
      <button class="channel-tab" data-channel="intercambio" type="button">💎 <span>Intercambio</span></button>
      <button class="channel-tab" data-channel="oficial" type="button">📢 <span>Oficial</span></button>
    </nav>

    <section id="pinnedMessage" class="pinned-message hidden" aria-live="polite"></section>
    <section id="messages" class="messages" aria-live="polite" aria-label="Mensajes del chat">
      <p class="empty-state">Cargando mensajes…</p>
    </section>

    <section id="replyBar" class="reply-bar hidden">
      <div><span>Respondiendo a </span><strong id="replyName"></strong></div>
      <button id="cancelReplyButton" type="button" aria-label="Cancelar respuesta">✕</button>
    </section>

    <footer class="composer-panel">
      <div id="emojiPanel" class="emoji-panel hidden" aria-label="Emojis rápidos">
        <button type="button">😀</button><button type="button">😂</button><button type="button">😍</button>
        <button type="button">🐶</button><button type="button">🦴</button><button type="button">🏆</button>
        <button type="button">💎</button><button type="button">🔥</button><button type="button">👏</button>
        <button type="button">❤️</button><button type="button">👍</button><button type="button">🎮</button>
      </div>
      <form id="messageForm" class="composer" autocomplete="off">
        <button id="emojiButton" class="composer-tool" type="button" aria-label="Mostrar emojis">😊</button>
        <label class="sr-only" for="messageInput">Escribe un mensaje</label>
        <textarea id="messageInput" maxlength="300" rows="1" placeholder="Escribe un mensaje…" required></textarea>
        <button id="sendButton" class="send-button" type="submit" aria-label="Enviar mensaje">
          <span class="send-icon" aria-hidden="true">➤</span><span class="send-text">Enviar</span>
        </button>
      </form>
      <div class="composer-info"><span id="typingStatus"></span><span id="charCounter">0/300</span></div>
    </footer>
  </main>

  <dialog id="messageActionsDialog" class="chat-dialog">
    <div class="dialog-content">
      <h2>Opciones del mensaje</h2>
      <button id="replyAction" type="button">↩️ Responder</button>
      <button id="userInfoAction" type="button">👤 Ver jugador</button>
      <button id="blockAction" type="button">🚫 Bloquear jugador</button>
      <button id="reportAction" type="button">🚨 Reportar</button>
      <button id="muteAction" class="admin-only hidden" type="button">🔇 Silenciar 1 hora</button>
      <button id="banAction" class="admin-only danger hidden" type="button">⛔ Bloquear del chat</button>
      <button id="deleteAction" class="danger hidden" type="button">🗑️ Eliminar mensaje</button>
      <button id="closeActions" class="secondary" type="button">Cerrar</button>
    </div>
  </dialog>

  <dialog id="onlineUsersDialog" class="chat-dialog">
    <div class="dialog-content dialog-list">
      <div class="dialog-heading"><h2>Jugadores conectados</h2><button id="closeOnlineUsers" class="close-circle" type="button">✕</button></div>
      <div id="onlineUsersList" class="user-list"><p class="empty-state compact">Cargando…</p></div>
    </div>
  </dialog>

  <dialog id="userInfoDialog" class="chat-dialog">
    <div class="dialog-content user-card-dialog">
      <button id="closeUserInfo" class="close-circle top-right" type="button">✕</button>
      <div id="userInfoContent"></div>
      <button id="userBlockButton" type="button">🚫 Bloquear jugador</button>
    </div>
  </dialog>

  <dialog id="adminDialog" class="chat-dialog">
    <form id="adminForm" class="dialog-content">
      <h2>Mensaje oficial</h2>
      <label for="adminMessage">Mensaje</label>
      <textarea id="adminMessage" maxlength="1000" rows="4" required></textarea>
      <label class="check-row"><input id="pinAdminMessage" type="checkbox"> Fijar mensaje en este canal</label>
      <button type="submit">👑 Publicar como JuniorGame Oficial</button>
      <button id="closeAdminDialog" class="secondary" type="button">Cancelar</button>
    </form>
  </dialog>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script type="module" src="js/chat.js?v=3"></script>
</body>
</html>
